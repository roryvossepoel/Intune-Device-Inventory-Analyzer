<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Analyze Microsoft Intune device inventory exports locally in your browser." />
    <link rel="icon" type="image/svg+xml" href="/Intune-Device-Inventory-Analyzer/logo.svg" />
    <meta name="theme-color" content="#2455d6" />
    <title>Intune Device Inventory Analyzer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('click', function (event) {
        const target = event.target;
        if (!(target instanceof Element)) return;
        const brand = target.closest('.brand');
        if (!brand) return;
        event.preventDefault();
        event.stopPropagation();
        window.location.reload();
      }, true);
    </script>
  </body>
</html>
